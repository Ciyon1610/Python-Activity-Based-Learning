<svg role="img" aria-label="Animated flowchart" xmlns="http://www.w3.org/2000/svg" width="900" height="1154" viewBox="0 0 900 1154">
<rect width="100%" height="100%" fill="#08080b"/>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b7bfcb"/></marker><filter id="boxShadow" x="-20%" y="-20%" width="150%" height="165%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.68"/></filter></defs><style>
.flow-step { transform-box: fill-box; transform-origin: center; animation-name: flowPulse; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
.flow-step ellipse, .flow-step rect, .flow-step polygon { animation-name: flowTint; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-delay: inherit; animation-duration: inherit; }
@keyframes flowPulse { 0%, 12%, 100% { transform: scale(1); filter: drop-shadow(0 6px 8px #7c3aed99); } 4%, 8% { transform: scale(1.035); filter: drop-shadow(0 10px 13px #c084fcdd); } }
@keyframes flowTint { 0%, 12%, 100% { fill: #e4d1ef; stroke: #7022a7; stroke-width: 4; } 4%, 8% { fill: #f1e4f8; stroke: #8c3bc0; stroke-width: 5; } }
@media (prefers-reduced-motion: reduce) { .flow-step, .flow-step ellipse, .flow-step rect, .flow-step polygon { animation: none !important; } }
</style>
<text x="450" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">University Scholarship Allocation</text>
<g filter="url(#boxShadow)" class="flow-step" style="animation-duration:7s;animation-delay:0s"><ellipse cx="450" cy="149" rx="55" ry="55" fill="#e4d1ef" stroke="#7022a7" stroke-width="4"/>
<text text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#344054" font-weight="500"><tspan x="450" y="157">Start</tspan></text></g>
<path d="M 450 205 L 450 233" fill="none" stroke="#b7bfcb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<g filter="url(#boxShadow)" class="flow-step" style="animation-duration:7s;animation-delay:1s"><rect x="185" y="246" width="530" height="106" rx="7" fill="#e4d1ef" stroke="#7022a7" stroke-width="4"/>
<text text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#344054" font-weight="500"><tspan x="450" y="292">Load student records and</tspan><tspan x="450" y="322">create an empty eligible list</tspan></text></g>
<path d="M 450 355 L 450 383" fill="none" stroke="#b7bfcb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<g filter="url(#boxShadow)" class="flow-step" style="animation-duration:7s;animation-delay:2s"><rect x="185" y="396" width="530" height="106" rx="7" fill="#e4d1ef" stroke="#7022a7" stroke-width="4"/>
<text text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#344054" font-weight="500"><tspan x="450" y="442">For each student, check aggregate,</tspan><tspan x="450" y="472">subject mark, attendance, and income</tspan></text></g>
<path d="M 450 505 L 450 533" fill="none" stroke="#b7bfcb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<g filter="url(#boxShadow)" class="flow-step" style="animation-duration:7s;animation-delay:3s"><rect x="185" y="546" width="530" height="106" rx="7" fill="#e4d1ef" stroke="#7022a7" stroke-width="4"/>
<text text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#344054" font-weight="500"><tspan x="450" y="592">Print failed requirements;</tspan><tspan x="450" y="622">add eligible students to the list</tspan></text></g>
<path d="M 450 655 L 450 683" fill="none" stroke="#b7bfcb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<g filter="url(#boxShadow)" class="flow-step" style="animation-duration:7s;animation-delay:4s"><rect x="185" y="696" width="530" height="106" rx="7" fill="#e4d1ef" stroke="#7022a7" stroke-width="4"/>
<text text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#344054" font-weight="500"><tspan x="450" y="742">Sort by aggregate, attendance,</tspan><tspan x="450" y="772">then lower income using nested loops</tspan></text></g>
<path d="M 450 805 L 450 833" fill="none" stroke="#b7bfcb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<g filter="url(#boxShadow)" class="flow-step" style="animation-duration:7s;animation-delay:5s"><polygon points="277,846 665,846 623,952 235,952" fill="#e4d1ef" stroke="#7022a7" stroke-width="4" stroke-linejoin="round"/>
<text text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#344054" font-weight="500"><tspan x="450" y="892">Display the ranked</tspan><tspan x="450" y="922">scholarship candidates</tspan></text></g>
<path d="M 450 955 L 450 983" fill="none" stroke="#b7bfcb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<g filter="url(#boxShadow)" class="flow-step" style="animation-duration:7s;animation-delay:6s"><ellipse cx="450" cy="1049" rx="55" ry="55" fill="#e4d1ef" stroke="#7022a7" stroke-width="4"/>
<text text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#344054" font-weight="500"><tspan x="450" y="1057">End</tspan></text></g>
</svg>
